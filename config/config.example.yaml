# Scholar Watch Configuration
# Copy this file to config.yaml and edit as needed.

database:
  # Path relative to project root, or absolute
  path: data/scholar_watch.db

scraping:
  # Delay range (seconds) between Scholar API calls
  min_delay: 5
  max_delay: 15
  # Longer delay range (seconds) before each "Cited by" fetch. These deep-link
  # listing pages are the requests Google guards most, so they're spaced out more
  # than ordinary profile fetches to keep CAPTCHAs rare.
  citing_min_delay: 12
  citing_max_delay: 30
  # How long to wait (seconds) for you to solve a CAPTCHA in the surfaced Chrome
  # window before giving up on that fetch.
  citing_captcha_solve_timeout: 180
  # Maximum publications to fetch per researcher
  max_publications: 500
  # When a publication gains citations, fetch the newest citing papers so the UI
  # can show *which* paper is the new cite (hover the change indicator). Set false
  # to track counts only (fewer Google Scholar requests).
  fetch_citing_papers: true
  # Cap on newest citing papers fetched per changed publication per run
  max_citing_per_pub: 10
  # Cap on how many papers get a "Cited by" fetch in a single run (0 = unlimited).
  # Prevents a big request burst after a long gap; extra papers defer to later runs.
  max_citing_pubs_per_run: 20
  # If Scholar refuses this many cited-by fetches in a row, stop fetching for the
  # rest of the run and post a warning notification (throttling protection).
  citing_throttle_threshold: 3
  # Citing papers are fetched by driving your real Chrome (Selenium), because Google
  # blocks scripted access — including headless Chrome. So a real Chrome window is used
  # (minimized, out of your way). Requires a one-time Google login ("Connect browser").
  citing_browser_headless: false
  # Optional: override the dedicated Chrome profile directory used for these fetches.
  # citing_browser_profile_dir: ""
  # Proxy configuration (optional)
  proxy:
    # Type: none, free, tor, scraperapi, single
    type: none
    # For scraperapi:
    # api_key: ${SCRAPERAPI_KEY}
    # For single proxy:
    # http: http://proxy:port
    # https: https://proxy:port

researchers:
  # List of Google Scholar IDs to track
  # Find your Scholar ID in your profile URL:
  #   https://scholar.google.com/citations?user=SCHOLAR_ID
  - scholar_id: "dkFXRBEAAAAJ"
    name: "Example Researcher"

email:
  enabled: false
  smtp:
    host: smtp.gmail.com
    port: 587
    use_tls: true
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
  from_address: scholar-watch@example.com
  to_addresses:
    - recipient@example.com
  subject_prefix: "[Scholar Watch]"

dashboard:
  host: "127.0.0.1"
  port: 5000
  debug: false
