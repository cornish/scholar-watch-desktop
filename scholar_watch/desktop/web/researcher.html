<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Researcher - Scholar Watch</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="/eel.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Scholar Watch</a>
        <ul class="navbar-nav">
            <li><a href="index.html">My Scholars</a></li>
            <li><a href="compare.html">Compare</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li>
                <a href="notifications.html" class="nav-notifications" id="nav-notif-link">
                    &#128276;<span class="notification-badge" id="notif-badge" style="display:none;"></span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="container">
        <div id="alert-area"></div>
        <div id="content">
            <p>Loading...</p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const scholarId = params.get("id");

        async function loadDetail() {
            if (!scholarId) {
                document.getElementById("content").innerHTML = '<p>No researcher specified.</p>';
                return;
            }

            const data = await eel.get_researcher_detail(scholarId)();
            if (data.error) {
                document.getElementById("content").innerHTML = '<p>' + escapeHtml(data.error) + '</p>';
                return;
            }

            const r = data.researcher;
            const m = data.metrics;
            document.title = r.name + " - Scholar Watch";

            let html = '<nav class="breadcrumb"><a href="index.html">My Scholars</a>' +
                '<span class="breadcrumb-sep">&rsaquo;</span><span>' + escapeHtml(r.name) + '</span></nav>';
            html += '<h1 class="page-title">' + escapeHtml(r.name) + '</h1>';

            if (r.affiliation) {
                html += '<p style="color: var(--gray-500); margin-top: -1rem; margin-bottom: 1rem;">' +
                    escapeHtml(r.affiliation) + '</p>';
            }

            if (data.interests && data.interests.length) {
                html += '<div style="margin-bottom: 1rem;">';
                for (const tag of data.interests) {
                    html += '<span class="tag">' + escapeHtml(tag) + '</span> ';
                }
                html += '</div>';
            }

            // Banners
            if (!r.last_scraped_at) {
                html += '<div class="banner banner-warning"><span class="banner-icon">&#9888;</span><div>' +
                    '<strong>No data yet.</strong> This scholar has not been scraped. ' +
                    'Click "Scrape" on the home page to fetch data.</div></div>';
            } else if (data.snapshot_count === 1) {
                html += '<div class="banner banner-info"><span class="banner-icon">&#8505;</span><div>' +
                    '<strong>Limited data.</strong> Only one scrape recorded. Trends and velocity require ' +
                    'at least two data points.</div></div>';
            }

            // Stats
            if (m) {
                html += '<div class="grid grid-4" style="margin-bottom: 1.5rem;">';
                html += statCard(m.total_citations, "Total Citations");
                html += statCard(m.h_index, "h-index");
                html += statCard(m.i10_index, "i10-index");
                html += statCard(m.num_publications, "Publications");
                html += '</div>';

                html += '<div class="grid grid-3" style="margin-bottom: 1.5rem;">';
                html += statCard(m.citation_velocity.toFixed(2), "Velocity (cites/day)");
                const accClass = m.citation_acceleration > 0 ? "delta-positive" :
                    (m.citation_acceleration < 0 ? "delta-negative" : "");
                html += '<div class="card stat-card"><div class="stat-value ' + accClass + '">' +
                    m.citation_acceleration.toFixed(3) + '</div><div class="stat-label">Acceleration</div></div>';
                html += statCard(m.citation_half_life != null ? m.citation_half_life : '-', "Half-Life (years)");
                html += '</div>';
            }

            // Tabs
            html += '<div class="tabs" data-tab-group="researcher">';
            html += '<button class="tab-btn active" data-tab="tab-overview">Overview</button>';
            html += '<button class="tab-btn" data-tab="tab-hindex">h-index</button>';
            html += '<button class="tab-btn" data-tab="tab-trending">Trending</button>';
            html += '<button class="tab-btn" data-tab="tab-publications">Publications</button>';
            html += '</div>';

            // Overview tab
            html += '<div id="tab-overview" class="tab-panel active" data-tab-group="researcher">';
            html += '<div class="grid grid-2">';
            html += '<div class="card chart-container"><div id="chart-citations"></div></div>';
            html += '<div class="card chart-container"><div id="chart-hindex"></div></div>';
            html += '</div>';
            html += '<div class="grid grid-2">';
            html += '<div class="card chart-container"><div id="chart-velocity"></div></div>';
            html += '<div class="card chart-container"><div id="chart-cpy"></div></div>';
            html += '</div>';
            html += '<div class="card chart-container"><div id="chart-top-papers"></div></div>';
            html += '</div>';

            // h-index tab
            html += '<div id="tab-hindex" class="tab-panel" data-tab-group="researcher">';
            html += '<div class="card chart-container"><div id="chart-hboundary"></div></div>';
            if (data.h_candidates && data.h_candidates.length) {
                html += '<div class="card"><h2 class="card-title">h-index Candidates</h2>';
                html += '<p style="color: var(--gray-500); margin-bottom: 1rem;">' +
                    'Papers closest to pushing the computed h-index from ' + data.computed_h +
                    ' to ' + (data.computed_h + 1) + '.' +
                    (m ? ' Google Scholar reports h = ' + m.h_index + '.' : '') + '</p>';
                html += '<div class="table-wrapper"><table><thead><tr>' +
                    '<th>Title</th><th>Citations</th><th>Needed</th><th>Velocity</th><th>Est. Days</th>' +
                    '</tr></thead><tbody>';
                for (const c of data.h_candidates) {
                    html += '<tr>';
                    html += '<td><a href="publication.html?id=' + c.publication_id + '">' +
                        escapeHtml(c.title) + '</a></td>';
                    html += '<td>' + c.current_citations + '</td>';
                    html += '<td>' + (c.citations_needed === 0 ?
                        '<span class="delta-positive">&#10003; ready</span>' : c.citations_needed) + '</td>';
                    html += '<td>' + (c.velocity > 0 ? '+' + c.velocity.toFixed(3) + '/day' : '&mdash;') + '</td>';
                    html += '<td>' + (c.days_to_h != null ? '~' + Math.round(c.days_to_h) + ' d' : '&mdash;') + '</td>';
                    html += '</tr>';
                }
                html += '</tbody></table></div></div>';
            }
            html += '</div>';

            // Trending tab
            html += '<div id="tab-trending" class="tab-panel" data-tab-group="researcher">';
            if (m && m.trending_papers && m.trending_papers.length) {
                html += '<div class="card"><h2 class="card-title">Trending Papers</h2>';
                html += '<div class="table-wrapper"><table><thead><tr>' +
                    '<th>Title</th><th>Citations</th><th>Last 7 d</th><th>Last 30 d</th><th>Velocity</th>' +
                    '</tr></thead><tbody>';
                for (const p of m.trending_papers) {
                    html += '<tr>';
                    html += '<td>' + escapeHtml(p.title) + '</td>';
                    html += '<td>' + p.current_citations + '</td>';
                    html += '<td>' + renderNewCites(p.new_citations_7d) + '</td>';
                    html += '<td>' + renderNewCites(p.new_citations_30d) + '</td>';
                    html += '<td class="delta-positive">+' + p.velocity.toFixed(3) + '/day</td>';
                    html += '</tr>';
                }
                html += '</tbody></table></div></div>';
            }
            if (m && m.declining_papers && m.declining_papers.length) {
                html += '<div class="card"><h2 class="card-title">Declining Papers</h2>';
                html += '<div class="table-wrapper"><table><thead><tr>' +
                    '<th>Title</th><th>Citations</th><th>Change</th>' +
                    '</tr></thead><tbody>';
                for (const p of m.declining_papers.slice(0, 10)) {
                    html += '<tr>';
                    html += '<td>' + escapeHtml(p.title) + '</td>';
                    html += '<td>' + p.current_citations + '</td>';
                    html += '<td class="delta-negative">' + p.citation_delta + '</td>';
                    html += '</tr>';
                }
                html += '</tbody></table></div></div>';
            }
            html += '</div>';

            // Publications tab — table is rendered (and re-rendered on sort) by renderPubTable()
            html += '<div id="tab-publications" class="tab-panel" data-tab-group="researcher">';
            html += '<div class="card"><h2 class="card-title">All Publications</h2>';
            html += '<div id="pub-table-container"></div>';
            if (data.pub_delta_since) {
                html += '<p class="delta-since-label">Changes since ' + escapeHtml(data.pub_delta_since) + '</p>';
            }
            html += '</div></div>';

            document.getElementById("content").innerHTML = html;

            // Initialize tabs
            initTabs();

            // Render the sortable publications table (also wires up the citing-paper popovers)
            pubItems = data.publications || [];
            renderPubTable();

            // Render charts
            if (data.charts) {
                renderChart("chart-citations", data.charts.citations);
                renderChart("chart-hindex", data.charts.h_index);
                renderChart("chart-velocity", data.charts.velocity);
                renderChart("chart-cpy", data.charts.cites_per_year);
                renderChart("chart-top-papers", data.charts.top_papers);
                renderChart("chart-hboundary", data.charts.h_boundary);
            }
        }

        // Popover visibility is managed in JS (not CSS :hover/:focus-within) so that
        // (a) a short grace delay lets you cross the gap onto the popup, (b) only one is
        // ever open, and (c) it closes on scroll/outside-click instead of sticking around.
        let activeCitePop = null;
        let citeCloseTimer = null;
        let citeGlobalsBound = false;

        function initCitePopovers() {
            document.querySelectorAll(".cite-hover").forEach(function (trigger) {
                const pop = trigger.querySelector(".cite-popover");
                if (!pop) return;
                trigger.addEventListener("mouseenter", function () { openCitePopover(trigger); });
                trigger.addEventListener("mouseleave", scheduleCiteClose);
                trigger.addEventListener("focusin", function () { openCitePopover(trigger); });
                trigger.addEventListener("focusout", scheduleCiteClose);
                pop.addEventListener("mouseenter", function () { clearTimeout(citeCloseTimer); });
                pop.addEventListener("mouseleave", scheduleCiteClose);
            });
            if (!citeGlobalsBound) {
                window.addEventListener("scroll", function (e) {
                    if (e.target === activeCitePop) return;   // scrolling inside the popup is fine
                    closeCitePopover();                        // any other scroll: position is now stale
                }, true);
                window.addEventListener("resize", closeCitePopover);
                document.addEventListener("click", function (e) {
                    if (!e.target.closest(".cite-hover")) closeCitePopover();
                });
                citeGlobalsBound = true;
            }
        }

        function openCitePopover(trigger) {
            clearTimeout(citeCloseTimer);
            const pop = trigger.querySelector(".cite-popover");
            if (!pop) return;
            if (activeCitePop && activeCitePop !== pop) activeCitePop.classList.remove("open");
            positionCitePopover(trigger, pop);
            pop.classList.add("open");
            activeCitePop = pop;
        }

        function scheduleCiteClose() {
            clearTimeout(citeCloseTimer);
            citeCloseTimer = setTimeout(closeCitePopover, 250);  // grace period to reach the popup
        }

        function closeCitePopover() {
            clearTimeout(citeCloseTimer);
            if (activeCitePop) { activeCitePop.classList.remove("open"); activeCitePop = null; }
        }

        function positionCitePopover(trigger, pop) {
            // Measure while still hidden (display:none until .open), without flashing.
            pop.style.visibility = "hidden";
            pop.style.display = "block";
            const r = trigger.getBoundingClientRect();
            const pw = pop.offsetWidth;
            const ph = pop.offsetHeight;
            pop.style.display = "";
            pop.style.visibility = "";

            const margin = 8;
            let left = r.right - pw;                 // right-align to the indicator
            if (left < margin) left = margin;
            if (left + pw > window.innerWidth - margin) {
                left = window.innerWidth - margin - pw;
            }
            let top = r.bottom + 4;                   // open just below
            if (top + ph > window.innerHeight - margin) {
                const above = r.top - ph - 4;         // flip above if it won't fit
                top = above >= margin ? above : Math.max(margin, window.innerHeight - margin - ph);
            }
            pop.style.left = left + "px";
            pop.style.top = top + "px";
        }

        // --- Sortable publications table ---
        let pubItems = [];
        let pubSort = { key: "citations", dir: -1 };  // matches the API's default (citations desc)

        function pubSortValue(item, key) {
            if (key === "title") return (item.title || "").toLowerCase();
            if (key === "year") return item.year;
            if (key === "citations") return item.citations;
            if (key === "change") return item.delta;   // may be null ("new")
            return null;
        }

        function sortPubs(key) {
            if (pubSort.key === key) {
                pubSort.dir *= -1;                       // same column: flip direction
            } else {
                pubSort.key = key;
                pubSort.dir = (key === "title") ? 1 : -1; // text asc, numbers desc by default
            }
            renderPubTable();
        }

        function renderPubTable() {
            const cont = document.getElementById("pub-table-container");
            if (!cont) return;
            const { key, dir } = pubSort;
            const items = pubItems.slice().sort(function (a, b) {
                let va = pubSortValue(a, key), vb = pubSortValue(b, key);
                const na = (va === null || va === undefined), nb = (vb === null || vb === undefined);
                if (na && nb) return 0;
                if (na) return 1;            // blanks/"new" always sort to the bottom
                if (nb) return -1;
                if (va < vb) return -1 * dir;
                if (va > vb) return 1 * dir;
                return 0;
            });
            const caret = function (k) {
                return pubSort.key === k ? (pubSort.dir === 1 ? " ↑" : " ↓") : "";
            };
            let h = '<div class="table-wrapper"><table><thead><tr>' +
                '<th class="sortable" onclick="sortPubs(\'title\')">Title' + caret("title") + '</th>' +
                '<th class="sortable" onclick="sortPubs(\'year\')">Year' + caret("year") + '</th>' +
                '<th class="sortable" onclick="sortPubs(\'citations\')">Citations' + caret("citations") + '</th>' +
                '<th class="sortable" onclick="sortPubs(\'change\')">Change' + caret("change") + '</th>' +
                '</tr></thead><tbody>';
            for (const item of items) {
                h += '<tr>';
                h += '<td><a href="publication.html?id=' + item.id + '">' +
                    escapeHtml(item.title) + '</a></td>';
                h += '<td>' + (item.year || '-') + '</td>';
                h += '<td>' + item.citations + '</td>';
                h += '<td>' + renderChangeCell(item) + '</td></tr>';
            }
            h += '</tbody></table></div>';
            cont.innerHTML = h;
            initCitePopovers();   // re-bind popovers after each (re-)render
        }

        function renderChangeCell(item) {
            // No prior snapshot to compare against yet.
            if (item.delta == null) {
                return '<span class="delta-indicator delta-unchanged">new</span>';
            }
            if (item.delta === 0) {
                return '<span class="delta-indicator delta-unchanged">&mdash;</span>';
            }
            const cls = item.delta > 0 ? 'delta-up' : 'delta-down';
            const arrow = item.delta > 0 ? '&#9650;' : '&#9660;';
            const indicator = '<span class="delta-indicator ' + cls + '"><span class="delta-arrow">' +
                arrow + '</span>' + Math.abs(item.delta) + '</span>';

            // When the count rose and we know which papers are the new cites, make the
            // indicator a hover target that reveals them.
            const citing = item.new_citing || [];
            if (item.delta > 0 && (citing.length || item.citedby_url)) {
                return '<span class="cite-hover" tabindex="0">' + indicator +
                    renderCitePopover(item) + '</span>';
            }
            return indicator;
        }

        function renderCitePopover(item) {
            const citing = item.new_citing || [];
            const n = citing.length;
            let head;
            if (!n) {
                head = 'Citations';
            } else if (item.delta && item.delta > n) {
                // We only preview the newest few; say so rather than implying n is the total.
                head = 'Newest ' + n + ' of ' + item.delta + ' new citations';
            } else {
                head = 'New citation' + (n > 1 ? 's (' + n + ')' : '');
            }
            let html = '<span class="cite-popover" role="tooltip">';
            html += '<span class="cite-popover-head">' + head + '</span>';
            for (const c of citing) {
                html += '<span class="cite-item">';
                const titleHtml = escapeHtml(c.title || 'Untitled');
                if (c.url) {
                    html += '<a class="cite-item-title" href="' + escapeHtml(c.url) +
                        '" target="_blank" rel="noopener">' + titleHtml + '</a>';
                } else {
                    html += '<span class="cite-item-title">' + titleHtml + '</span>';
                }
                const meta = [];
                if (c.authors) meta.push(c.authors);
                if (c.venue) meta.push(c.venue);
                if (c.year) meta.push(c.year);
                if (meta.length) {
                    html += '<span class="cite-item-meta">' + escapeHtml(meta.join(' · ')) + '</span>';
                }
                html += '</span>';
            }
            if (item.citedby_url) {
                html += '<a class="cite-popover-all" href="' + escapeHtml(item.citedby_url) +
                    '" target="_blank" rel="noopener">See all ' + item.citations +
                    ' on Google Scholar &rarr;</a>';
            }
            return html + '</span>';
        }

        function renderNewCites(val) {
            if (val != null && val > 0) return '<span class="delta-positive">+' + val + '</span>';
            if (val != null) return '' + val;
            return '&mdash;';
        }

        function statCard(value, label) {
            return '<div class="card stat-card"><div class="stat-value">' + value +
                '</div><div class="stat-label">' + label + '</div></div>';
        }

        loadDetail();
        updateNotifBadge();
    </script>
</body>
</html>
